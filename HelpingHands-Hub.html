  <div id="app"></div>
  <script>
  (()=>{
    const USER={name:'Alex Morgan',email:'alex.morgan@example.com',phone:'(555) 014-2810'};
    const causes=['All causes','Environment','Education','Health','Animal Welfare'];
    const sampleNames=[['Jordan Lee','jordan.lee@example.com'],['Samira Patel','samira.patel@example.com'],['Noah Brooks','noah.brooks@example.com'],['Maya Chen','maya.chen@example.com'],['Riley Thompson','riley.thompson@example.com'],['Ava Williams','ava.williams@example.com'],['Ethan Rivera','ethan.rivera@example.com'],['Priya Shah','priya.shah@example.com'],['Lucas Martin','lucas.martin@example.com'],['Zoe Kim','zoe.kim@example.com'],['Amir Hassan','amir.hassan@example.com'],['Isabella Garcia','isabella.garcia@example.com'],['Theo Nguyen','theo.nguyen@example.com'],['Grace Wilson','grace.wilson@example.com'],['Mateo Davis','mateo.davis@example.com'],['Nina Kapoor','nina.kapoor@example.com'],['Owen Clarke','owen.clarke@example.com'],['Layla Robinson','layla.robinson@example.com'],['Finn Cooper','finn.cooper@example.com'],['Elena Torres','elena.torres@example.com'],['Kai Bennett','kai.bennett@example.com'],['Sofia Reed','sofia.reed@example.com'],['Arjun Mehta','arjun.mehta@example.com'],['Chloe Baker','chloe.baker@example.com'],['Gabriel Flores','gabriel.flores@example.com'],['Harper Evans','harper.evans@example.com'],['Leo Murphy','leo.murphy@example.com'],['Anika Das','anika.das@example.com'],['Miles Foster','miles.foster@example.com'],['Sara Ahmed','sara.ahmed@example.com'],['Dylan Price','dylan.price@example.com'],['Mei Lin','mei.lin@example.com'],['Aiden Scott','aiden.scott@example.com'],['Fatima Ali','fatima.ali@example.com'],['Ruby James','ruby.james@example.com']];
    const templates=[
      ['tree','Urban Tree Plantation Drive','GreenEarth Brigade','Environment','2026-11-21','Cedar Grove Park','Northside',4,'🌱','Plant 300 native saplings and make our neighborhood cooler, greener, and healthier.','Prepare planting beds, place young native trees, and add protective mulch. Tools and a short orientation are provided.',['Morning|8:00 AM – 12:00 PM','Afternoon|1:00 PM – 5:00 PM','Evening|5:30 PM – 9:30 PM'],'mint'],
      ['pantry','Community Pantry Packing Day','City Food Bank','Health','2026-11-22','Central Community Kitchen','Downtown',3.5,'🥕','Pack 500 fresh-food boxes for families across the city.','Sort donated produce, pack pantry boxes, and prepare deliveries for local families.',['Morning|8:30 AM – 12:00 PM','Afternoon|12:30 PM – 4:00 PM','Evening|4:30 PM – 8:00 PM'],'peach'],
      ['reading','Weekend Reading Buddies','YouthMinds Tutoring','Education','2026-11-22','Maple Street Learning Center','East End',2.5,'📚','Give 24 young readers a little extra confidence and attention.','Read together, play word games, and encourage elementary-age students. Activity ideas are provided.',['Morning|9:00 AM – 11:30 AM','Afternoon|1:00 PM – 3:30 PM'],'purple'],
      ['paws','Paws & People Adoption Open House','PawsRescue Shelter','Animal Welfare','2026-11-28','PawsRescue Community Shelter','Westside',3,'🐾','Help 15 rescue pets meet people who could become their forever families.','Welcome visitors, share each pet’s story, and help keep the adoption space calm.',['Morning|9:00 AM – 12:00 PM','Afternoon|1:00 PM – 4:00 PM'],'rose'],
      ['river','Riverside Clean-up & Nature Walk','GreenEarth Brigade','Environment','2026-11-29','Willowbend River Trail','Riverside',3,'🌳','Clear litter from two miles of riverbank and protect local wildlife.','Join a guided litter pick along the river. Gloves, bags, water, and a safety briefing are included.',['Morning|8:00 AM – 11:00 AM','Afternoon|12:00 PM – 3:00 PM','Evening|3:30 PM – 6:30 PM'],'mint'],
      ['wellness','Neighborhood Wellness Kit Assembly','City Food Bank','Health','2026-12-05','Central Community Kitchen','Downtown',3,'💛','Put together 200 practical care kits for neighborhood outreach teams.','Assemble personal-care kits, add welcome notes, and organize supplies for outreach.',['Morning|9:00 AM – 12:00 PM','Afternoon|1:00 PM – 4:00 PM','Evening|4:30 PM – 7:30 PM'],'peach'],
      ['homework','Homework Club: Math & More','YouthMinds Tutoring','Education','2026-12-06','Maple Street Learning Center','East End',2,'✏️','Make after-school learning welcoming for 18 middle-school students.','Support students with homework, study habits, and confidence. Learning materials are supplied.',['Morning|9:30 AM – 11:30 AM','Afternoon|1:00 PM – 3:00 PM'],'purple'],
      ['shelter','Shelter Enrichment Morning','PawsRescue Shelter','Animal Welfare','2026-12-12','PawsRescue Community Shelter','Westside',2.5,'🐕','Bring comfort and play to shelter pets waiting for their homes.','Prepare enrichment toys, spend time with cats, or take a supervised dog walk.',['Morning|9:00 AM – 11:30 AM','Afternoon|12:30 PM – 3:00 PM'],'rose']
    ];
    function seeded(){let ix=0;const drives=templates.map(t=>({id:t[0],title:t[1],org:t[2],category:t[3],date:t[4],place:t[5],area:t[6],hours:t[7],emoji:t[8],goal:t[9],description:t[10],theme:t[12],shifts:t[11].map((s,j)=>{const [period,time]=s.split('|');return{id:t[0]+'-'+period.toLowerCase(),period,time,capacity:10,volunteers:[]}})}));drives.forEach((d,di)=>d.shifts.forEach((s,si)=>{let n=ix<35?(di===0&&si===0?6:2):0;for(let k=0;k<n&&ix<35;k++,ix++){let [name,email]=sampleNames[ix];s.volunteers.push({name,email,phone:`(555) 01${String(ix+10).padStart(2,'0')}-2840`,attended:ix%3===0})}}));return{drives,interests:['Environment','Education'],past:[{id:'old-park',title:'Neighborhood Park Restoration',date:'2026-11-14',hours:4,emoji:'🌳'}]}}
    let state;try{state=JSON.parse(localStorage.getItem('helpinghands-html-v1'))||seeded()}catch(e){state=seeded()}
    let page='Dashboard',category='All causes',query='',matchesOnly=false,selected='tree',orgDrive='tree',toastTimer;
    const app=document.querySelector('#app');
    const fmt=(d,opts={weekday:'short',month:'short',day:'numeric'})=>new Intl.DateTimeFormat('en',opts).format(new Date(d+'T12:00:00'));
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const match=d=>{const union=new Set([d.category,...state.interests]);return state.interests.includes(d.category)?Math.round(100/union.size):0};
    const open=d=>d.shifts.reduce((a,s)=>a+Math.max(0,s.capacity-s.volunteers.length),0);
    const mine=()=>state.drives.flatMap(d=>d.shifts.flatMap(s=>s.volunteers.filter(v=>v.email===USER.email).map(v=>({drive:d,shift:s,volunteer:v}))));
    const hours=()=>state.past.reduce((a,x)=>a+x.hours,0)+mine().reduce((a,x)=>a+(x.volunteer.attended?x.drive.hours:0),0);
    const completed=()=>state.past.length+new Set(mine().filter(x=>x.volunteer.attended).map(x=>x.drive.id)).size;
    const save=()=>localStorage.setItem('helpinghands-html-v1',JSON.stringify(state));
    function toast(msg){let old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2600)}
    function header(){return `<header class="topbar"><div class="brand"><span class="brand-mark">✳</span><span>HelpingHands<small>HUB</small></span></div><nav class="nav" aria-label="Main navigation">${['Dashboard','Explore drives','My impact','Organizer'].map(x=>`<button class="${page===x?'active':''}" data-page="${x}">${x}</button>`).join('')}</nav><div class="profile"><span class="avatar">AM</span><span class="name">Alex Morgan</span></div></header>`}
    function card(d){return `<article class="card"><div class="card-art ${d.theme}"><span>${d.emoji}</span><span class="art-org">${esc(d.org)}</span>${match(d)?`<span class="match">✦ ${match(d)}% match</span>`:''}</div><div class="card-body"><div class="meta"><span class="tag">${esc(d.category)}</span><span>${fmt(d.date)}</span></div><h3>${esc(d.title)}</h3><p class="loc">⌖ ${esc(d.place)}</p><p class="goal">${esc(d.goal)}</p><div class="card-bottom"><span>● ${open(d)} spots left</span><button data-open="${d.id}">See details ↗</button></div></div></article>`}
    function stats(){return `<div class="stats"><div class="stat"><span class="stat-icon">◷</span><label>Hours given</label><strong>${hours()} <small>hrs</small></strong><small>verified community service</small></div><div class="stat"><span class="stat-icon">✳</span><label>Drives completed</label><strong>${completed()}</strong><small>and counting</small></div><div class="stat"><span class="stat-icon">▦</span><label>My sign-ups</label><strong>${mine().length}</strong><small>upcoming volunteer shifts</small></div><div class="stat"><span class="stat-icon">♡</span><label>Open spots</label><strong>${state.drives.reduce((a,d)=>a+open(d),0)}</strong><small>ways to help nearby</small></div></div>`}
    function dashboard(){let rec=state.drives.filter(d=>state.interests.includes(d.category));let featured=state.drives.slice(0,2);return `<section class="hero"><div class="hero-copy"><p class="eyebrow">SMALL ACTS. BIG CHANGE.</p><h2>Make time for<br><em>good things.</em></h2><p>Find a local way to help, meet your neighbors, and see the difference your time makes.</p><div class="actions"><button class="btn" data-page="Explore drives">Find a volunteer shift ↗</button><button class="linkbtn" data-matches>See my matches →</button></div></div><div class="art"><span class="orbit"></span><span class="plant">🪴</span><span class="badge"><b>✿</b> YOUR KIND OF<br>COMMUNITY</span></div></section>${stats()}<div class="grid"><section><div class="section-head"><div><p class="eyebrow">PICKED FOR YOU</p><h2>Good things happening</h2></div><button class="linkbtn" data-page="Explore drives">All drives ↗</button></div><div class="cards">${featured.map(card).join('')}</div></section><aside class="side"><section class="panel"><p class="eyebrow">YOUR NEXT CHAPTER</p><h3>Coming up</h3>${mine().length?mine().map(x=>`<div class="upcoming"><span>${x.drive.emoji}</span><div>${esc(x.drive.title)}<small>${fmt(x.drive.date)} · ${x.shift.period}</small></div></div>`).join(''):'<p>No shifts on your calendar yet. Find a good fit below.</p>'}<button class="panel-link" data-page="Explore drives">Explore opportunities <span>→</span></button></section><section class="panel"><p class="eyebrow">MAKE IT YOURS</p><h3>What moves you?</h3><p>Choose causes you care about and we’ll bring relevant opportunities your way.</p><div class="chips">${causes.slice(1).map(c=>`<button class="chip ${state.interests.includes(c)?'selected':''}" data-interest="${c}">${state.interests.includes(c)?'✓':'+'} ${c}</button>`).join('')}</div><button class="panel-link" data-matches>Show my matches <span>→</span></button></section></aside></div>`}
    function explore(){let list=state.drives.filter(d=>(category==='All causes'||d.category===category)&&(!matchesOnly||state.interests.includes(d.category))&&(!query||`${d.title} ${d.org} ${d.place} ${d.category}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>match(b)-match(a)||a.date.localeCompare(b.date));return `<section class="explore-intro"><div><p class="eyebrow">FIND YOUR WAY TO HELP</p><h2>There’s a place for you here.</h2><p>Good people, doing practical things, right around the corner.</p></div><div class="date">${state.drives.length} local drives</div></section><div class="searchrow"><label class="search"><span>⌕</span><input id="search" value="${esc(query)}" placeholder="Search drives, causes, or places" aria-label="Search drives"></label><button class="matchtoggle ${matchesOnly?'active':''}" data-toggle-match>✦ Matched to me</button></div><div class="filters">${causes.map(c=>`<button class="filter ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><div class="results"><span>${list.length} opportunities</span><span>Best fit for you ✦</span></div>${list.length?`<div class="cards explorecards">${list.map(card).join('')}</div>`:'<div class="empty">No drives found. Try another cause or clear your search.</div>'}`}
    function impact(){const activities=[...state.past.map(x=>({...x,status:'Verified'})),...mine().map(x=>({id:x.shift.id,title:x.drive.title,date:x.drive.date,hours:x.volunteer.attended?x.drive.hours:0,status:x.volunteer.attended?'Verified':'Upcoming',emoji:x.drive.emoji}))].sort((a,b)=>b.date.localeCompare(a.date));const badge=hours()>=10?'🏅 10-Hour Hero':hours()>=4?'🌿 Green Steward':'🌱 Kindness Starter';return `<section class="impact-banner"><div><p class="eyebrow">YOUR TIME, YOUR IMPACT</p><h2>A little care adds up.</h2><p>Every hour you give becomes part of a stronger community.</p></div><div class="total"><strong>${hours()}</strong><span>verified<br>hours</span></div></section><div class="impactstats"><div class="stat"><label>Verified hours</label><strong>${hours()} hrs</strong><small>confirmed by a coordinator</small></div><div class="stat"><label>Drives completed</label><strong>${completed()}</strong><small>neighbors helped along the way</small></div><div class="panel badgebox"><span class="medal">${badge.split(' ')[0]}</span><div><p class="eyebrow">LATEST BADGE</p><h3>${badge.substring(badge.indexOf(' ')+1)}</h3><p>You’re helping good things take root.</p></div></div></div><div class="grid"><section class="activity"><div class="section-head"><div><p class="eyebrow">YOUR GOOD WORK</p><h2>Service history</h2></div><button class="linkbtn" data-certificate>Certificate ↗</button></div>${activities.map(a=>`<div class="activity-row"><span class="emoji">${a.emoji||'✳'}</span><div>${esc(a.title)}<small>${fmt(a.date,{month:'short',day:'numeric',year:'numeric'})}</small></div><b class="${a.status==='Verified'?'verified':''}">${a.status==='Verified'?'+'+a.hours+' hrs':'Upcoming'}<small>${a.status}</small></b></div>`).join('')}<button class="btn cert" data-certificate>Preview service certificate</button></section><aside class="panel"><p class="eyebrow">KEEP THE GOOD GOING</p><h3>Find another opportunity</h3><p>Your next volunteer shift is just around the corner.</p><button class="btn" data-page="Explore drives">Explore drives ↗</button></aside></div>`}
    function organizer(){const d=state.drives.find(x=>x.id===orgDrive)||state.drives[0];const volunteers=d.shifts.flatMap(s=>s.volunteers.map(v=>({...v,shift:s})));const attended=volunteers.filter(v=>v.attended).length;return `<section class="org-banner"><div><p class="eyebrow">ORGANIZER WORKSPACE</p><h2>Make every helping hand count.</h2><p>Manage your drive roster and confirm the people who showed up.</p></div><span style="font-size:44px">☷</span></section><div class="organizer-select"><div><p class="eyebrow">DRIVE ROSTER</p><h2>Volunteer check-in</h2></div><select id="org-select" aria-label="Choose a drive">${state.drives.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="orgstats"><div class="orgstat"><strong>${volunteers.length} / ${d.shifts.reduce((a,s)=>a+s.capacity,0)}</strong><small>registered volunteers</small></div><div class="orgstat"><strong>${attended} / ${volunteers.length}</strong><small>attendance confirmed</small></div><div class="orgstat"><strong>${d.hours} hrs</strong><small>service time per shift</small></div><div class="orgstat"><strong>${d.area}</strong><small>${fmt(d.date)}</small></div></div><section class="roster"><p class="eyebrow">${esc(d.org)}</p><h3>${esc(d.title)}</h3><p>${fmt(d.date,{weekday:'long',month:'long',day:'numeric'})} · ${esc(d.place)}</p><table class="table"><thead><tr><th>Volunteer</th><th>Shift</th><th>Contact</th><th>Attendance</th><th>Action</th></tr></thead><tbody>${volunteers.length?d.shifts.flatMap(s=>s.volunteers.map(v=>`<tr><td>${esc(v.name)}${v.email===USER.email?' (You)':''}</td><td>${s.period}</td><td><a href="mailto:${encodeURIComponent(v.email)}">${esc(v.email)}</a><br>${esc(v.phone||'')}</td><td class="${v.attended?'status present':''}">${v.attended?'✓ Attended':'Not checked in'}</td><td><button data-attend="${s.id}|${encodeURIComponent(v.email)}">${v.attended?'Undo':'Mark attended'}</button></td></tr>`)).join(''):'<tr><td colspan="5">No sign-ups yet.</td></tr>'}</tbody></table></section><p class="note">ⓘ Confirm attendance after the shift. Verified hours will appear on the volunteer impact page.</p>`}
    function modal(d){return `<div class="modal-bg" data-bg><section class="modal" role="dialog" aria-modal="true"><button class="close" data-close aria-label="Close">×</button><div class="modal-banner ${d.theme}">${d.emoji}</div><div class="modal-content"><p class="eyebrow">${fmt(d.date,{weekday:'long',month:'long',day:'numeric'})} · ${esc(d.place)}</p><h2>${esc(d.title)}</h2><p><b>${esc(d.goal)}</b></p><p>${esc(d.description)}</p><p>${d.hours} hours per shift · ${esc(d.category)} · ${esc(d.org)}</p><h3>Choose a shift</h3>${d.shifts.map(s=>{let signed=s.volunteers.some(v=>v.email===USER.email),already=d.shifts.some(x=>x.volunteers.some(v=>v.email===USER.email)),left=s.capacity-s.volunteers.length;return `<div class="shift"><div><b>${s.period}</b><small>${s.time} · ${left} spots left</small></div><button data-signup="${d.id}|${s.id}" ${signed||already||left<=0?'disabled':''}>${signed?'Your spot':already?'One shift only':left<=0?'Full':'Sign me up'}</button></div>`}).join('')}</div></section></div>`}
    function render(){const title=page==='Dashboard'?'Your community dashboard':page;let content=page==='Dashboard'?dashboard():page==='Explore drives'?explore():page==='My impact'?impact():organizer();app.innerHTML=header()+`<main class="wrap main"><div class="heading"><div><p class="eyebrow">YOUR NEIGHBORHOOD, A LITTLE BRIGHTER</p><h1>${title}</h1></div><span class="date">Saturday, November 21</span></div>${content}</main><footer class="wrap footer"><b>HelpingHands Hub</b><span>Good things grow when we do them together.</span><span>${state.drives.reduce((a,d)=>a+d.shifts.reduce((n,s)=>n+s.volunteers.length,0),0)} neighbors signed up</span></footer>${selected?modal(state.drives.find(d=>d.id===selected)||state.drives[0]):''}`;bind()}
    function bind(){app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;selected=null;render()});app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;render()});app.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{selected=null;render()});app.querySelectorAll('[data-bg]').forEach(b=>b.onclick=e=>{if(e.target===b){selected=null;render()}});app.querySelectorAll('[data-signup]').forEach(b=>b.onclick=()=>{let [did,sid]=b.dataset.signup.split('|');let d=state.drives.find(x=>x.id===did),s=d.shifts.find(x=>x.id===sid);if(d.shifts.some(x=>x.volunteers.some(v=>v.email===USER.email))){toast('You already have a spot in this drive.');return}if(s.volunteers.length>=s.capacity){toast('Sorry, that shift just filled up.');return}s.volunteers.push({...USER,attended:false});save();selected=null;render();toast('You’re on the list! Your spot is saved.')});app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render()});app.querySelectorAll('[data-interest]').forEach(b=>b.onclick=()=>{let c=b.dataset.interest;state.interests=state.interests.includes(c)?state.interests.filter(x=>x!==c):[...state.interests,c];save();render()});app.querySelectorAll('[data-toggle-match]').forEach(b=>b.onclick=()=>{matchesOnly=!matchesOnly;render()});app.querySelectorAll('[data-matches]').forEach(b=>b.onclick=()=>{page='Explore drives';matchesOnly=true;render()});const search=document.querySelector('#search');if(search)search.oninput=()=>{query=search.value;const pos=search.selectionStart;render();const next=document.querySelector('#search');next.focus();next.setSelectionRange(pos,pos)};const os=document.querySelector('#org-select');if(os)os.onchange=()=>{orgDrive=os.value;render()};app.querySelectorAll('[data-attend]').forEach(b=>b.onclick=()=>{let [sid,em]=b.dataset.attend.split('|');em=decodeURIComponent(em);let d=state.drives.find(x=>x.id===orgDrive),s=d.shifts.find(x=>x.id===sid),v=s.volunteers.find(x=>x.email===em);v.attended=!v.attended;save();render()});app.querySelectorAll('[data-certificate]').forEach(b=>b.onclick=()=>window.print());document.onkeydown=e=>{if(e.key==='Escape'&&selected){selected=null;render()}}}
    render();
  })();
  </script>
</body>
